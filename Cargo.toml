[package]
name = "arbitrage-rs"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Arbitrage models for spot, futures, perpetuals and options: pricing relations, opportunity detection and multi-leg execution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/arbitrage-rs"
homepage = "https://github.com/joaquinbejar/arbitrage-rs"
keywords = ["finance", "arbitrage", "hedging", "trading", "quantitative"]
categories = ["finance", "mathematics"]
publish = true
include = [
    "/src/**/*",
    "/tests/**/*.rs",
    "/tests/fixtures/deep_hedging_band.csv",
    "/docs/exact-arithmetic.md",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
name = "arbitrage_rs"
path = "src/lib.rs"

[dependencies]
financial_types = "0.3"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2.0"

[dev-dependencies]
rust_decimal_macros = "1.40"
# The shared, hand computed instrument fixtures (tests/instrument_fixtures.rs).
financial_types = { version = "0.3", features = ["fixtures"] }

[features]
default = []
# Conversion of a `financial_types` instrument specification into the types
# the kernels take (the `spec` module). Asking for
# `financial_types/instruments` is what excludes 0.3.0, which has no such
# feature, while `financial_types = "0.3"` keeps it valid without this feature.
instruments = ["financial_types/instruments"]

# docs.rs builds default features only unless told otherwise.
[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
