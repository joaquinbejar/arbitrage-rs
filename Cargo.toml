[package]
name = "arbitrage-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Arbitrage models for spot, futures, perpetuals and options: pricing relations, opportunity detection and multi-leg execution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/arbitrage-rs"
homepage = "https://github.com/joaquinbejar/arbitrage-rs"
keywords = ["finance", "arbitrage", "hedging", "trading", "quantitative"]
categories = ["finance", "mathematics"]
publish = true
include = [
    "src/**/*",
    "tests/**/*.rs",
    "docs/exact-arithmetic.md",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lib]
name = "arbitrage_rs"
path = "src/lib.rs"

[dependencies]
financial_types = "0.3"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2.0"

[dev-dependencies]
rust_decimal_macros = "1.40"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
